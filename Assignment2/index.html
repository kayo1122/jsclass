<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the website responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Search for movies and display results from The Movie Database API."
    >

    <title>Movie Search</title>

    <!-- External CSS file -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- External JavaScript file; defer waits until the HTML is loaded -->
    <script src="js/script.js" defer></script>
</head>

<body>
    <header class="site-header">
        <h1>Movie Search</h1>
        <p>Search for movies and view posters, ratings, release dates, and descriptions.</p>
    </header>

    <main>
        <!-- Movie search form -->
        <section class="search-section" aria-labelledby="search-heading">
            <h2 id="search-heading">Find a Movie</h2>

            <form id="searchForm">
                <label for="searchInput">Movie title</label>

                <div class="search-controls">
                    <input
                        type="search"
                        id="searchInput"
                        name="movieTitle"
                        placeholder="Example: The Batman"
                        required
                    >

                    <button type="submit">Search</button>
                </div>
            </form>
        </section>

        <!-- JavaScript will update this message while loading or on errors -->
        <p id="statusMessage" role="status" aria-live="polite"></p>

        <!-- JavaScript will dynamically add movie cards here -->
        <section
            id="results"
            class="movie-results"
            aria-label="Movie search results"
        ></section>
    </main>

    <footer class="site-footer">
        <p id="studentInfo">Romano Scerbo-Morra <br> Student ID : 200673567</p>

        <p>
            This product uses the TMDB API but is not endorsed or certified by TMDB.
        </p>

        <p>
            <a
                href="https://developer.themoviedb.org/docs/getting-started"
                target="_blank"
                rel="noopener noreferrer"
            >
                TMDB API documentation used for this project
            </a>
        </p>
    </footer>
</body>
</html>
