<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pizza Order Form</title>

  <!-- Link stylesheet -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- Defer JS so it runs after the DOM is parsed -->
  <script src="js/script.js" defer></script>
</head>
<body>

  <header>
    <h1>Build Your Own Pizza</h1>
    <!-- Student ID and Name -->
    <p id="student-info"></p>
  </header>

  <main>
    <form id="pizza-form" novalidate>

      <!-- Customer name -->
      <div class="form-group">
        <label for="customerName">Your Name</label>
        <input
          type="text"
          id="customerName"
          name="customerName"
          placeholder="e.g. Romano"
          required
          minlength="2"
        />
        <span class="error-msg" id="err-customerName"></span>
      </div>

      <!-- Pizza size -->
      <div class="form-group">
        <label for="size">Size</label>
        <select id="size" name="size" required>
          <option value="">-- choose a size --</option>
          <option value="Small (10&quot;)">Small (10")</option>
          <option value="Medium (12&quot;)">Medium (12")</option>
          <option value="Large (14&quot;)">Large (14")</option>
          <option value="Extra Large (16&quot;)">Extra Large (16")</option>
        </select>
        <span class="error-msg" id="err-size"></span>
      </div>

      <!-- Crust type -->
      <fieldset class="form-group">
        <legend>Crust</legend>
        <label class="radio-label">
          <input type="radio" name="crust" value="Thin Crust" required /> Thin Crust
        </label>
        <label class="radio-label">
          <input type="radio" name="crust" value="Regular Crust" /> Regular Crust
        </label>
        <label class="radio-label">
          <input type="radio" name="crust" value="Stuffed Crust" /> Stuffed Crust
        </label>
        <label class="radio-label">
          <input type="radio" name="crust" value="Gluten-Free Crust" /> Gluten-Free Crust
        </label>
        <span class="error-msg" id="err-crust"></span>
      </fieldset>

      <!-- Toppings (multiple checkboxes) -->
      <fieldset class="form-group">
        <legend>Toppings (choose at least 1)</legend>
        <label class="checkbox-label">
          <input type="checkbox" name="toppings" value="Pepperoni" /> Pepperoni
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="toppings" value="Mushrooms" /> Mushrooms
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="toppings" value="Green Peppers" /> Green Peppers
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="toppings" value="Onions" /> Onions
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="toppings" value="Extra Cheese" /> Extra Cheese
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="toppings" value="Bacon" /> Bacon
        </label>
        <label class="checkbox-label">
          <input type="checkbox" name="toppings" value="Pineapple" /> Pineapple
        </label>
        <span class="error-msg" id="err-toppings"></span>
      </fieldset>

      <!-- Quantity -->
      <div class="form-group">
        <label for="quantity">Quantity</label>
        <input
          type="number"
          id="quantity"
          name="quantity"
          min="1"
          max="10"
          value="1"
          required
        />
        <span class="error-msg" id="err-quantity"></span>
      </div>

      <!-- Delivery method -->
      <div class="form-group">
        <label for="delivery">Delivery Method</label>
        <select id="delivery" name="delivery" required>
          <option value="">-- choose an option --</option>
          <option value="Pickup">Pickup</option>
          <option value="Delivery">Delivery</option>
        </select>
        <span class="error-msg" id="err-delivery"></span>
      </div>

      <!-- Special instructions -->
      <div class="form-group">
        <label for="notes">Special Instructions</label>
        <textarea
          id="notes"
          name="notes"
          maxlength="150"
          placeholder="Anything else we should know? (optional)"
        ></textarea>
      </div>

      <button type="submit" id="orderBtn">Order Pizza</button>
    </form>

    <!-- Where the Pizza object's description gets displayed -->
    <section id="order-output" aria-live="polite"></section>
  </main>

  <footer>
    <p>&copy; 2026 Pizza Palace</p>
  </footer>

</body>
</html>
