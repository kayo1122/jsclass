<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mission Control</title>
        <link rel="stylesheet" href="style.css">
    </head>
    
<body>
    <h2>Mission Control</h2>
    <div id="mission-builder">

        <!-- Agent Type -->
        <div class="mission-row">
            <button id="btn-agent">Agent Type</button>
            <span id="display-agent">Not selected</span>
        </div>

        <!-- Mission Location -->
        <div class="mission-row">
            <button id="btn-location">Mission Location</button>
            <span id="display-location">Not selected</span>
        </div>

        <!-- Weapon Loadout -->
        <div class="mission-row">
            <button id="btn-weapon">Weapon Loadout</button>
            <span id="display-weapon">Not selected</span>
        </div>

        <!-- Mission Objective -->
        <div class="mission-row">
            <button id="btn-objective">Mission Objective</button>
            <span id="display-objective">Not selected</span>
        </div>

        <!-- Risk Level -->
        <div class="mission-row">
            <button id="btn-risk">Risk Level</button>
            <span id="display-risk">Not selected</span>
        </div>

        <!-- Launch + Reset -->
        <div class="mission-row">
            <button id="btn-launch">LAUNCH MISSION</button>
            <button id="btn-reset">RESET</button>
        </div>

    </div>

    <div id="briefing-output"></div>

    <!-- Script tag goes here at the bottom, just once -->
    <script src="script.js"></script>
</body>
</html>
