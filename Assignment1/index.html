
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> Mission Control</title>
        <script src="script.js"></script>
    </head>
    
<body>
    <h2>Mission Control</h2>
    <div id ="mission-builder">

    <!--  agent type-->    
        <div class="mission-row">
            <button = "btn-agent-type">Agent Type</button>
            <span id="agent-type"></span>
        </div>

    <!--  mission location-->    
        <div class="mission-row">
            <button = "btn-mission-location">Mission Location</button>
            <span id="mission-location"></span>
        </div>

    <!--  weapon loadout-->    
        <div class="mission-row">
            <button = "btn-weapon-loadout">Weapon Loadout</button>
            <span id="weapon-loadout"></span>
        </div>
    <!--  mission objective-->    
        <div class="mission-row">
            <button = "btn-mission-objective">Mission Objective</button>
            <span id="mission-objective"></span>
        </div>
    <!--  risk level-->    
        <div class="mission-row">
            <button = "btn-risk-level">Risk Level</button>
            <span id="risk-level"></span>
        </div>
    <!--  launch button-->    
        <div class="mission-row">
            <button = "btn-launch-mission">LAUNCH MISSION</button>
        </div>
    </div>










</body>
